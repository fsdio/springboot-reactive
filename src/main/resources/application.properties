spring.application.name=springboot-reactive
spring.devtools.add-properties=false
spring.main.allow-bean-definition-overriding=true
spring.main.web-application-type=reactive

# Server configuration
server.port=8080
server.address=localhost
server.tomcat.uri-encoding=UTF-8
# server.servlet.context-path=/api/v1

# Database configuration
spring.r2dbc.url=r2dbc:mysql://localhost:3306/db_springboot_reactive_notes
spring.r2dbc.username=root
spring.r2dbc.password=
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.max-size=10
spring.r2dbc.pool.initial-size=1
spring.r2dbc.pool.max-idle-time=30m
spring.r2dbc.pool.max-life-time=1h

spring.data.r2dbc.repositories.enabled=true

# JWT configuration
# jwt.secret=your_jwt_secret_key
#30 menit dalam detik
# jwt.expiration-time=1800

# Logging configuration
logging.file.path=logs/
logging.file.name=logs/springboot-reactive.log
logging.level.root=info
logging.level.web=info
logging.logback.rollingpolicy.max-file-size=1MB
logging.logback.rollingpolicy.max-history=7
